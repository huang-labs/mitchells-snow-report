name: Refresh PR preview data

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Same-repository open PR number
        required: true
        type: string
      channel:
        description: Refresh sources only, one Daily Snow channel, or all regions followed by West
        required: true
        default: none
        type: choice
        options: [none, western-us, utah, tahoe, mammoth, tetons, montana, colorado, washington, oregon, all]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-data-${{ inputs.pr }}
  cancel-in-progress: false

jobs:
  refresh:
    if: vars.MITCHELLS_DEPLOYMENT_ENABLED == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 120
    environment: preview
    steps:
      - name: Resolve and validate the PR head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: |
          [[ "$PR" =~ ^[1-9][0-9]*$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" > "$RUNNER_TEMP/preview-pr.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" '.state == "open" and .head.repo.full_name == $repo' "$RUNNER_TEMP/preview-pr.json"
          echo "sha=$(jq -r '.head.sha' "$RUNNER_TEMP/preview-pr.json")" >> "$GITHUB_OUTPUT"
      - uses: useblacksmith/checkout@v1
        with:
          ref: ${{ steps.pr.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://pr-${{ inputs.pr }}-mitchells-snow-report-preview.huang-inc.workers.dev
      - name: Refresh preview and optionally regenerate Daily Snow
        env:
          PR: ${{ inputs.pr }}
          CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Workers AI Read and AI Gateway Run only, so model calls never carry the deploy token.
          WORKERS_AI_TOKEN: ${{ inputs.channel != 'none' && secrets.PR_AGENT_CLOUDFLARE_TOKEN || '' }}
        run: npx tsx scripts/preview-run.ts data --pr "$PR" --channel "$CHANNEL"
