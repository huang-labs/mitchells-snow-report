name: AI review

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  review:
    # The trusted base workflow never checks out or executes PR code.
    # Same-repo, non-draft PRs review automatically; a collaborator can comment exactly /review on an open PR.
    if: >-
      github.event.sender.type != 'Bot' &&
      ((github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        !github.event.pull_request.draft) ||
       (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        github.event.issue.state == 'open' && github.event.comment.body == '/review' &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)))
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # Allow two 20-minute attempts plus startup/backoff for a transient retry.
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      # A newer push or /review replaces an in-progress review of the same PR.
      group: ai-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    steps:
      - name: PR-Agent review
        uses: The-PR-Agent/pr-agent@efdde4afe14aa401a3889012c7f3e9ef3081a430 # v0.49.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # GLM 5.3 on Workers AI through the `pr-agent` AI Gateway (model set in .pr_agent.toml).
          CLOUDFLARE_API_BASE: https://gateway.ai.cloudflare.com/v1/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pr-agent/workers-ai/v1
          CLOUDFLARE_API_KEY: ${{ secrets.PR_AGENT_CLOUDFLARE_TOKEN }}
          # Every review and /review rerun runs fresh inference.
          LITELLM__EXTRA_HEADERS: '{"cf-aig-skip-cache": "true"}'
          # Read review policy from the trusted default branch, never the PR branch.
          PR_AGENT_CONFIG_BRANCH: ${{ github.event.repository.default_branch }}
          CONFIG__USE_GLOBAL_SETTINGS_FILE: 'false'
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: 'true'
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: 'false'
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: 'false'
          GITHUB_ACTION_CONFIG__PR_ACTIONS: '["opened", "reopened", "ready_for_review"]'
          GITHUB_ACTION_CONFIG__HANDLE_PUSH_TRIGGER: 'true'
          GITHUB_ACTION_CONFIG__PUSH_COMMANDS: '["/review"]'
