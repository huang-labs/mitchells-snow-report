name: Deploy

# Every push to main is tested, then deployed to production
# (mitchells-snow-report.huang.mx). Pull requests are tested, then uploaded as a
# isolated Worker Preview deployment with a stable per-PR URL
# (pr-<number>-mitchells-snow-report-preview.huang-inc.workers.dev), linked in a PR comment.
# Fork uploads require MITCHELLS_DEPLOYMENT_ENABLED=true after isolated resources are configured.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Never run two production deploys at once; a newer push waits for the current one.
# Finish a PR's preview writes before another deployment for it starts.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node --test .github/scripts/review-gate.test.cjs
      - run: npm run cf:build
      - run: npm run smoke

  deploy:
    needs: test
    if: >-
      vars.MITCHELLS_DEPLOYMENT_ENABLED == 'true' &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment:
      name: production
      url: https://mitchells-snow-report.huang.mx
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build and deploy (static export + Worker)
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  preview:
    needs: test
    # Only for PRs from this repo: fork and Dependabot PRs get no secrets.
    if: >-
      vars.MITCHELLS_DEPLOYMENT_ENABLED == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    environment:
      name: preview
      url: ${{ steps.upload.outputs.url }}
    concurrency:
      group: preview-data-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build static frontend
        run: npm run build
        env:
          SITE_URL: https://pr-${{ github.event.pull_request.number }}-mitchells-snow-report-preview.huang-inc.workers.dev
      - name: Refresh dedicated PR data and deploy preview
        id: upload
        run: npx tsx scripts/preview-run.ts deploy --pr "$PR"
        env:
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Pages are static assets and share cards render without an article,
      # so this check doesn't wait for the just-written KV to reach the edge.
      - name: Verify deployed share previews
        run: npx tsx scripts/check-share-preview.ts "$PREVIEW_URL"
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
